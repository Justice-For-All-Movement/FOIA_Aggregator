services:
  - type: web
    name: foia-aggregator
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: FOIA_STORAGE_BACKEND
        value: b2
      - key: FOIA_BOOTSTRAP_DB_FROM_B2
        value: "true"
      - key: FOIA_ADMIN_USERNAME
        value: admin
      - key: FOIA_AUTONOMOUS_REFRESH_ENABLED
        value: "false"
      - key: FOIA_DB_PATH
        value: /data/foia_archive.db
      - key: FOIA_FILES_DIR
        value: /data/files
      - key: B2_KEY_ID
        sync: false
      - key: B2_APPLICATION_KEY
        sync: false
      # Optional when the B2 key is scoped to exactly one bucket.
      - key: B2_BUCKET
        sync: false
      - key: B2_REGION
        sync: false
      - key: B2_ENDPOINT_URL
        sync: false
      # Admin dashboard stays disabled (404) until this is set.
      - key: FOIA_ADMIN_PASSWORD
        sync: false
      - key: FOIA_PUBLIC_BASE_URL
        sync: false
      # Enables POST /api/v1/ingest/sfl-bundle (>= 24 chars); disabled when unset.
      - key: FOIA_INGEST_TOKEN
        sync: false
      - key: B2_MAX_ARCHIVE_BYTES
        value: "8500000000"
