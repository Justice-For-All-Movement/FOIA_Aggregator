name: Autonomous corpus refresh

on:
  schedule:
    - cron: "17 4 * * 2,5"
  workflow_dispatch:
    inputs:
      since_days:
        description: "Archive only documents published in the last N days (blank = no window)"
        required: false
        default: "7"
      published_since:
        description: "Explicit window start YYYY-MM-DD (overrides since_days)"
        required: false
        default: ""
      published_until:
        description: "Explicit window end YYYY-MM-DD (optional)"
        required: false
        default: ""
      include_unknown_dates:
        description: "Also download documents with no detectable published date"
        type: boolean
        required: false
        default: false

concurrency:
  group: foia-b2-single-writer
  cancel-in-progress: false

jobs:
  refresh:
    # Deliberately OFF until live B2 checkpoint/recovery acceptance passes.
    # Set the repository variable FOIA_AUTONOMOUS_REFRESH_ENABLED=true to
    # activate scheduled runs. Manual dispatch remains an explicit operator act.
    if: github.event_name == 'workflow_dispatch' || vars.FOIA_AUTONOMOUS_REFRESH_ENABLED == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      PYTHONPATH: .
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      FOIA_STORAGE_BACKEND: b2
      FOIA_DB_PATH: data/foia_archive.db
      FOIA_FILES_DIR: data/files
      B2_MAX_ARCHIVE_BYTES: "8500000000"
      FOIA_EXPANSION_TARGET_TOTAL_BYTES: "9000000000"
      FOIA_EXPANSION_MAX_WAVES: "1"
      FOIA_CRAWLER_DRY_RUN: "false"
      FOIA_SOURCE_LIMIT: "0"
      FOIA_MAX_DOCS_PER_SOURCE: "1"
      FOIA_MAX_PAGES_PER_SOURCE: "5"
      FOIA_MAX_DEPTH: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Verify Backblaze secrets
        shell: bash
        run: |
          test -n "$B2_KEY_ID"
          test -n "$B2_APPLICATION_KEY"

      - name: Install extraction system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y antiword catdoc tesseract-ocr

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve FOIA.gov API key
        env:
          REPO_FOIA_API_KEY: ${{ secrets.FOIA_API_KEY }}
        run: |
          if [ -n "$REPO_FOIA_API_KEY" ]; then
            echo "::add-mask::$REPO_FOIA_API_KEY"
            echo "FOIA_API_KEY=$REPO_FOIA_API_KEY" >> "$GITHUB_ENV"
            exit 0
          fi
          python - <<'PY'
          import os
          import re
          import requests
          from bs4 import BeautifulSoup

          repo = requests.get(
              "https://api.github.com/repos/usdoj/foia.gov",
              timeout=30,
          )
          repo.raise_for_status()
          branch = repo.json()["default_branch"]
          spec = requests.get(
              f"https://raw.githubusercontent.com/usdoj/foia.gov/{branch}/swagger.json",
              timeout=30,
          )
          spec.raise_for_status()
          text = BeautifulSoup(
              spec.json()["info"]["description"],
              "html.parser",
          ).get_text(" ", strip=True)
          match = re.search(
              r"use\s+the\s+following\s+api[_ -]?key\s+for\s+testing\.?\s*([A-Za-z0-9_-]{20,})",
              text,
              flags=re.IGNORECASE,
          )
          if not match:
              raise SystemExit("Could not recover FOIA.gov published testing API key")
          key = match.group(1)
          print(f"::add-mask::{key}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as out:
              out.write(f"FOIA_API_KEY={key}\n")
          PY

      - name: Resolve published-date window
        env:
          IN_SINCE_DAYS: ${{ github.event_name == 'workflow_dispatch' && inputs.since_days || vars.FOIA_REFRESH_SINCE_DAYS }}
          IN_SINCE: ${{ inputs.published_since }}
          IN_UNTIL: ${{ inputs.published_until }}
          IN_UNKNOWN: ${{ inputs.include_unknown_dates }}
        run: |
          set -euo pipefail
          date_re='^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
          if [ -n "$IN_SINCE" ]; then
            [[ "$IN_SINCE" =~ $date_re ]] || { echo "published_since must be YYYY-MM-DD"; exit 1; }
            echo "FOIA_PUBLISHED_SINCE=$IN_SINCE" >> "$GITHUB_ENV"
          elif [ -n "$IN_SINCE_DAYS" ]; then
            [[ "$IN_SINCE_DAYS" =~ ^[0-9]{1,4}$ ]] || { echo "since_days must be an integer"; exit 1; }
            echo "FOIA_PUBLISHED_SINCE_DAYS=$IN_SINCE_DAYS" >> "$GITHUB_ENV"
          fi
          if [ -n "$IN_UNTIL" ]; then
            [[ "$IN_UNTIL" =~ $date_re ]] || { echo "published_until must be YYYY-MM-DD"; exit 1; }
            echo "FOIA_PUBLISHED_UNTIL=$IN_UNTIL" >> "$GITHUB_ENV"
          fi
          if [ -n "$IN_SINCE$IN_SINCE_DAYS$IN_UNTIL" ]; then
            # Out-of-window candidates never consume quota, so allow more
            # in-window documents per source; B2 caps still apply in code.
            echo "FOIA_MAX_DOCS_PER_SOURCE=10" >> "$GITHUB_ENV"
          fi
          if [ "$IN_UNKNOWN" = "true" ]; then
            echo "FOIA_PUBLISHED_INCLUDE_UNKNOWN=true" >> "$GITHUB_ENV"
          fi
          echo "Window: since=${IN_SINCE:-} since_days=${IN_SINCE_DAYS:-} until=${IN_UNTIL:-} unknown=${IN_UNKNOWN:-false}"

      - name: Run one autonomous refresh wave
        run: python scripts/expand_corpus.py
