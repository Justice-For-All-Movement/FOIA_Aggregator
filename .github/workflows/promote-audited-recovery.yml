name: Promote audited FOIA recovery checkpoint

# Inert until an operator deliberately enables it: no push/schedule trigger,
# requires FOIA_RECOVERY_PROMOTION_ENABLED=true and a typed confirmation.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type PROMOTE to write a new verified B2 checkpoint
        required: true
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: foia-b2-single-writer
  cancel-in-progress: false

jobs:
  promote:
    if: vars.FOIA_RECOVERY_PROMOTION_ENABLED == 'true' && inputs.confirm == 'PROMOTE'
    runs-on: ubuntu-22.04
    timeout-minutes: 70
    env:
      PYTHONPATH: .
      GH_TOKEN: ${{ github.token }}
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      FOIA_STORAGE_BACKEND: b2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python requirements
        run: pip install -r requirements.txt
      - name: Download proven recovery candidate
        shell: bash
        run: |
          test -n "$B2_KEY_ID"
          test -n "$B2_APPLICATION_KEY"
          mkdir -p recovery
          gh run download 38010903638 --repo ${{ github.repository }} \
            --name foia-recovery-preserved-38010903638 --dir recovery
          test -s recovery/foia_archive.db
      - name: Re-audit and publish a verified new B2 checkpoint
        run: python scripts/promote_audited_recovery.py
