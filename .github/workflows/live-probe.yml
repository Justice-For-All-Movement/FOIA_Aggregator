name: live-probe

# Bounded, read-only live probe of public sources. No secrets, no storage, no
# document downloads: listing pages plus bounded HEAD requests (Last-Modified,
# Content-Length), robots.txt honoured, polite per-host delays and the honest
# crawler UA. Sources are sharded by organisation across parallel runners.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Resolve FOIA.gov published testing key (public; masked)
        run: |
          key="$(python scripts/resolve_foia_api_key.py || true)"
          if [ -n "$key" ]; then
            echo "::add-mask::$key"
            echo "FOIA_API_KEY=$key" >> "$GITHUB_ENV"
          fi
      - name: Broad window crawl (informational; never fails the PR on remote outages)
        run: python scripts/live_probe.py "broad-crawl:7:${{ matrix.shard }}/4"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-summary-${{ matrix.shard }}
          path: probe-summary-*.json
          if-no-files-found: warn
          retention-days: 7

  published-logs:
    # Dry run: lists log files on each registered agency log page (robots.txt,
    # honest UA, 2 s/host). No downloads, no writes, never fails the PR.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Published FOIA log pages (informational)
        run: |
          python main.py published-logs --dry-run --max-files 5 --summary-json published-logs-summary.json || true
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY" || true
          import json
          s = json.load(open("published-logs-summary.json"))
          print("## Published FOIA log pages (dry run)")
          print(f"- Sources: {s['sources']}; states: {s['states']}; log files found: {s['files_found']}")
          print("| Source | State | Files | Detail |\n|---|---|---|---|")
          for r in s["results"]:
              print(f"| {r['source_id']} | {r['state']} | {r.get('files_found', 0)} | {str(r.get('detail', ''))[:120]} |")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-logs-summary
          path: published-logs-summary.json
          if-no-files-found: warn
          retention-days: 14

  aggregate:
    needs: probe
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          path: probe-summaries
      - name: Coverage and weekly volume estimate
        env:
          # Optional; empty on forks or when unset (listing then records BLOCKED/auth).
          MUCKROCK_API_TOKEN: ${{ secrets.MUCKROCK_API_TOKEN }}
        run: python scripts/live_probe.py aggregate:probe-summaries diagnose muckrock-requests:7
