name: live-probe

# Bounded, read-only live probe of public sources. No secrets, no B2, no
# document downloads; polite per-host delays and the honest crawler UA.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Live probe (informational; never fails the PR on remote outages)
        env:
          # Optional; empty on forks or when unset (listing then records BLOCKED/auth).
          MUCKROCK_API_TOKEN: ${{ secrets.MUCKROCK_API_TOKEN }}
        run: python scripts/live_probe.py window-crawl:7 muckrock-requests:7
